site_name: Beejones Knowledge Base
site_description: An assembly of knowledge assembled by Beejones
site_author: Beejones

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - search.share

plugins:
  - search
  - awesome-pages
  - minify
  - glightbox
  - mermaid2
  - section-index
  - redirects

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.emoji
  - pymdownx.mark
  - pymdownx.inlinehilite

docs_dir: docs
